<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 全局与和风调色盘 --- */
        :root {
            --c-border-vermilion: #8f2626;
            --c-ghost-cyan: #78ffc6;
            --c-ink-paper: #d8cbb8;
            --c-gold-leaf: #dfa668;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Kaiti", "SimSun", "MS Mincho", serif;
            background: transparent;
            color: var(--c-ink-paper);
            overflow: hidden;
            user-select: none;
        }

        .lantern-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            padding: 4px 0 10px 0;
        }

        /* --- 外壳神龛：和风漆器黑匣 --- */
        .lantern-shell {
            position: relative;
            width: 100%;
            max-width: 300px;
            padding: 14px 14px 16px 14px;
            border-radius: 12px;
            background: radial-gradient(circle at 50% 10%, #1a191f 0%, #0d0d10 60%, #050507 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(223, 166, 104, 0.25);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 0 25px rgba(0, 0, 0, 0.9),
                0 14px 30px rgba(0, 0, 0, 0.85);
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        .lantern-shell.haunted-glow::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(180, 30, 30, 0.25);
            animation: shellBreath 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shellBreath {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.8;
            }
        }

        .lantern-shell.historical-snapshot {
            filter: sepia(0.4) grayscale(0.3) contrast(1.1);
        }

        .sealed-watermark {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            font-weight: bold;
            color: rgba(143, 38, 38, 0.7);
            border: 1.5px solid rgba(143, 38, 38, 0.6);
            border-radius: 2px;
            padding: 1px 5px;
            transform: rotate(12deg);
            pointer-events: none;
            opacity: 0;
            z-index: 20;
            letter-spacing: 2px;
        }

        .lantern-shell.historical-snapshot .sealed-watermark {
            opacity: 1;
        }

        /* --- 顶部：神篱环境条 --- */
        .env-info-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 5px 10px;
            background: linear-gradient(90deg, rgba(143, 38, 38, 0.2) 0%, rgba(20, 20, 24, 0.6) 70%, transparent 100%);
            border-left: 2px solid var(--c-border-vermilion);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            box-sizing: border-box;
        }

        .env-location {
            font-size: 12px;
            color: #dcd3c5;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .env-location svg {
            width: 13px;
            height: 13px;
            fill: #b83636;
            filter: drop-shadow(0 0 3px rgba(184, 54, 54, 0.6));
        }

        .env-presence {
            display: flex;
            gap: 8px;
        }

        .katashiro {
            width: 15px;
            height: 17px;
            color: #777;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .katashiro svg {
            width: 100%;
            height: 100%;
        }

        .katashiro.kiraga.active {
            color: var(--c-ghost-cyan);
            filter: drop-shadow(0 0 5px rgba(120, 255, 198, 0.7));
        }

        .katashiro.sae.active {
            color: #ffb74d;
            filter: drop-shadow(0 0 5px rgba(255, 183, 77, 0.7));
        }

        .katashiro.absent {
            opacity: 0.2;
            filter: grayscale(1);
            transform: scale(0.85);
        }

        /* --- 圆柱长提灯实体 --- */
        .lantern-stage {
            position: relative;
            margin: 4px auto 10px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lantern-stage.interactive {
            cursor: pointer;
        }

        .lantern-stage.interactive:hover {
            transform: translateY(-1px) scale(1.015);
        }

        @keyframes rejectShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-3px);
            }

            75% {
                transform: translateX(3px);
            }
        }

        .lantern-stage.shake {
            animation: rejectShake 0.3s ease;
        }

        .lantern-hanger {
            width: 38px;
            height: 11px;
            border: 2px solid #3d352e;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-bottom: -1px;
            z-index: 6;
        }

        .lantern-cap {
            width: 102px;
            height: 8px;
            background: linear-gradient(to bottom, #2c2520, #13100e);
            border: 1px solid #423830;
            border-radius: 3px 3px 1px 1px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.85);
            z-index: 6;
        }

        .lantern-base {
            width: 98px;
            height: 8px;
            background: linear-gradient(to bottom, #181513, #0b0908);
            border: 1px solid #382f28;
            border-radius: 1px 1px 4px 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.9);
            z-index: 6;
        }

        .lantern {
            position: relative;
            width: 94px;
            height: 148px;
            border-radius: 4px;
            background:
                linear-gradient(90deg,
                    rgba(0, 0, 0, 0.85) 0%,
                    rgba(25, 22, 20, 0.3) 18%,
                    rgba(50, 42, 36, 0.1) 50%,
                    rgba(25, 22, 20, 0.3) 82%,
                    rgba(0, 0, 0, 0.85) 100%),
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 13px,
                    rgba(20, 16, 14, 0.7) 14px,
                    rgba(55, 45, 38, 0.45) 15px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 24px,
                    rgba(35, 28, 24, 0.25) 25px),
                radial-gradient(ellipse at 50% 50%, #1e1a17 0%, #110e0d 65%, #080707 100%);
            border-left: 1.5px solid #2b221d;
            border-right: 1.5px solid #2b221d;
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.95), 0 8px 24px rgba(0, 0, 0, 0.9);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lantern-stand {
            position: absolute;
            bottom: 24px;
            width: 14px;
            height: 3px;
            background: #332822;
            border-radius: 1px;
            z-index: 6;
            opacity: 0.7;
        }

        .lantern-wick {
            position: absolute;
            bottom: 27px;
            width: 2px;
            height: 16px;
            background: linear-gradient(to top, #3a2e26, #110d0a);
            border-radius: 1px;
            z-index: 6;
            opacity: 0.6;
            transition: all 0.5s ease;
        }

        .lantern-wick::after {
            content: "";
            position: absolute;
            top: -3px;
            left: -1.5px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #5a2015;
            opacity: 0.6;
            filter: blur(0.5px);
            transition: all 0.4s ease;
        }

        .lantern-glow {
            position: absolute;
            inset: 4px;
            border-radius: 4px;
            background: radial-gradient(ellipse at 50% 60%, rgba(120, 255, 198, 0.2) 0%, transparent 75%);
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.8s ease;
            will-change: opacity, transform;
        }

        .lantern.interactive::after {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            font-weight: bold;
            letter-spacing: 4px;
            padding-left: 4px;
            pointer-events: none;
            opacity: 0;
            transition: all 0.35s ease;
            z-index: 10;
            font-family: "Kaiti", "SimSun", serif;
        }

        .lantern.interactive.member-ready::after {
            content: "点亮";
            font-size: 15px;
            color: rgba(240, 255, 250, 0.95);
            text-shadow: 0 0 6px #000, 0 0 12px rgba(120, 255, 198, 0.8);
        }

        .lantern-stage.interactive:hover .lantern.member-ready {
            border-left-color: rgba(120, 255, 198, 0.4);
            border-right-color: rgba(120, 255, 198, 0.4);
            box-shadow: inset 0 0 16px rgba(120, 255, 198, 0.08), 0 0 20px rgba(120, 255, 198, 0.15);
        }

        .lantern-stage.interactive:hover .lantern.member-ready .lantern-glow {
            opacity: 0.35;
        }

        .lantern-stage.interactive:hover .lantern.member-ready .lantern-wick::after {
            background: #ff7043;
            box-shadow: 0 0 6px #ff7043;
            opacity: 1;
        }

        .lantern.interactive.tutorial-sealed::after {
            content: "封";
            font-size: 18px;
            color: #e57373;
            text-shadow: 0 0 6px #000, 0 0 12px rgba(229, 115, 115, 0.8);
        }

        .lantern-stage.interactive:hover .lantern.tutorial-sealed {
            border-left-color: rgba(180, 40, 40, 0.4);
            border-right-color: rgba(180, 40, 40, 0.4);
            box-shadow: inset 0 0 16px rgba(180, 40, 40, 0.1), 0 0 16px rgba(143, 38, 38, 0.25);
        }

        .lantern-stage.interactive:hover .lantern.tutorial-sealed .lantern-glow {
            opacity: 0.25;
            background: radial-gradient(ellipse at 50% 60%, rgba(180, 40, 40, 0.35) 0%, transparent 75%);
        }

        .lantern-stage.interactive:hover .lantern::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }

        @keyframes flameLit {

            0%,
            100% {
                opacity: 0.85;
                transform: scale(1) translateZ(0);
                filter: blur(7px);
            }

            50% {
                opacity: 1;
                transform: scale(1.04) translateZ(0);
                filter: blur(5px);
            }
        }

        .lantern.flame-lit .lantern-glow {
            opacity: 1;
            background: radial-gradient(ellipse at 50% 65%, #f0fff9 10%, rgba(120, 255, 198, 0.65) 45%, rgba(20, 60, 48, 0.25) 80%, transparent 100%);
            animation: flameLit 3s infinite ease-in-out;
        }

        .lantern.flame-lit {
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.6) 0%, transparent 20%, transparent 80%, rgba(0, 0, 0, 0.6) 100%),
                radial-gradient(ellipse at 50% 60%, #0d2621 0%, #081512 60%, #030505 100%);
            border-left-color: rgba(120, 255, 198, 0.5);
            border-right-color: rgba(120, 255, 198, 0.5);
            box-shadow: 0 0 25px rgba(120, 255, 198, 0.3), inset 0 0 20px rgba(120, 255, 198, 0.2);
        }

        /* 点灯或怪谈对抗时，彻底隐去死板的灯芯支架 */
        .lantern.flame-lit .lantern-wick,
        .lantern.flame-lit .lantern-stand,
        .lantern.flame-haunted .lantern-wick,
        .lantern.flame-haunted .lantern-stand {
            opacity: 0 !important;
        }

        .lantern.flame-lit::after {
            display: none !important;
        }

        /* 怪谈压力光 */
        .lantern.flame-haunted.mp-5 {
            border-left-color: #64ffda;
            border-right-color: #64ffda;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        .lantern.flame-haunted.mp-5 .lantern-glow {
            opacity: 1;
            background: radial-gradient(ellipse at 50% 65%, #e0fbf4 10%, rgba(100, 255, 218, 0.55) 50%, transparent 85%);
            animation: flameLit 2.5s infinite;
        }

        .lantern.flame-haunted.mp-4 {
            border-left-color: #ffd54f;
            border-right-color: #ffd54f;
            box-shadow: 0 0 20px rgba(255, 213, 79, 0.25);
        }

        .lantern.flame-haunted.mp-4 .lantern-glow {
            opacity: 0.9;
            background: radial-gradient(ellipse at 50% 65%, #fff9c4 10%, rgba(255, 202, 40, 0.55) 50%, transparent 85%);
            animation: flameLit 2s infinite;
        }

        .lantern.flame-haunted.mp-3 {
            border-left-color: #ff8a65;
            border-right-color: #ff8a65;
            box-shadow: 0 0 20px rgba(255, 112, 67, 0.3);
        }

        .lantern.flame-haunted.mp-3 .lantern-glow {
            opacity: 0.9;
            background: radial-gradient(ellipse at 50% 65%, #ffebee 10%, rgba(255, 87, 34, 0.65) 50%, transparent 85%);
            animation: flameLit 1.6s infinite;
        }

        .lantern.flame-haunted.mp-2 {
            border-left-color: #e53935;
            border-right-color: #e53935;
            box-shadow: 0 0 25px rgba(229, 57, 53, 0.4);
        }

        .lantern.flame-haunted.mp-2 .lantern-glow {
            opacity: 0.95;
            background: radial-gradient(ellipse at 50% 65%, #ffcdd2 10%, rgba(211, 47, 47, 0.75) 60%, transparent 85%);
            animation: flameLit 1.2s infinite;
        }

        .lantern.flame-haunted.mp-critical {
            border-left-color: #b71c1c;
            border-right-color: #b71c1c;
            box-shadow: 0 0 35px rgba(183, 28, 28, 0.7);
        }

        .lantern.flame-haunted.mp-critical .lantern-glow {
            opacity: 1;
            background: radial-gradient(ellipse at 50% 65%, #1a0000 0%, #b71c1c 45%, transparent 80%);
            animation: flameLit 0.7s infinite alternate;
        }

        /* --- 阶段文字 --- */
        .phase-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13.5px;
            letter-spacing: 2.5px;
            margin: 4px 0 3px 0;
            color: #e2d7c7;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .phase-text::before,
        .phase-text::after {
            content: "❖";
            font-size: 9px;
            color: var(--c-border-vermilion);
            opacity: 0.8;
        }

        .title-text {
            text-align: center;
            font-size: 12.5px;
            color: #bcaaa4;
            margin-bottom: 6px;
            font-family: "Kaiti", serif;
            letter-spacing: 1px;
            min-height: 1.2em;
        }

        .phase-collapse {
            display: none !important;
        }

        /* --- 灵力点 --- */
        .spirit-bar-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 6px 0 10px 0;
            padding-top: 8px;
            border-top: 1px dashed rgba(143, 38, 38, 0.3);
        }

        .spirit-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .hitodama {
            width: 9px;
            height: 9px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 1px solid #333;
            background: #161616;
            box-shadow: inset 0 0 3px #000;
            transition: all 0.5s ease;
        }

        .hitodama.active {
            background: #4db6ac;
            border-color: #80cbc4;
            box-shadow: 0 0 8px rgba(100, 255, 218, 0.7), 0 0 3px #fff;
            animation: hitodamaFloat 3s infinite ease-in-out;
        }

        @keyframes hitodamaFloat {

            0%,
            100% {
                transform: rotate(-45deg) scale(1);
            }

            50% {
                transform: rotate(-45deg) scale(1.15);
            }
        }

        .mp-label {
            font-size: 10.5px;
            color: #887d75;
            letter-spacing: 2px;
        }

        /* --- 和风阴阳法具按键 --- */
        .vent-dock {
            display: flex;
            justify-content: center;
            gap: 24px;
            width: 100%;
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .vent-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #262322 0%, #151312 80%);
            border: 1px solid rgba(223, 166, 104, 0.2);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 4px 8px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        .vent-btn::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .vent-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(223, 166, 104, 0.6);
            box-shadow: 0 0 10px rgba(223, 166, 104, 0.25), 0 5px 12px rgba(0, 0, 0, 0.8);
        }

        .vent-btn.active {
            background: radial-gradient(circle at 40% 30%, #4a1515 0%, #200808 90%);
            border-color: #ff5252;
            box-shadow: 0 0 12px rgba(244, 67, 54, 0.4), inset 0 0 6px rgba(255, 82, 82, 0.3);
        }

        .vent-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #998f86;
            stroke-width: 1.8;
            transition: stroke 0.3s;
        }

        .vent-btn:hover .vent-icon {
            stroke: #dcd3c5;
        }

        .vent-btn.active .vent-icon {
            stroke: #ff8a80;
        }

        /* --- 抽屉折叠系统 --- */
        .drawer {
            width: 100%;
            margin-top: 10px;
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
            display: grid;
            grid-template-rows: 0fr;
            overflow: hidden;
            opacity: 0;
            transition: grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
        }

        .drawer.open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-bottom: 2px;
        }

        .drawer-content {
            min-height: 0;
            padding: 0 10px;
            font-size: 12px;
        }

        /* --- 🎴 抽屉一：结缘丝弦 --- */
        .bond-block {
            padding: 3px 2px;
        }

        .bond-block:first-child {
            margin-bottom: 8px;
        }

        .bond-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12.5px;
        }

        .bond-title {
            display: inline-block;
            font-size: 10px;
            padding: 1px 5px;
            margin-left: 4px;
            color: var(--c-gold-leaf);
            border: 1px solid rgba(223, 166, 104, 0.4);
            border-radius: 2px;
        }

        @keyframes seal-stamp {
            0% {
                transform: scale(2.2) rotate(-15deg);
                opacity: 0;
                color: #ff5252;
                border-color: #ff5252;
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .bond-title.rankup {
            animation: seal-stamp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .resonance-string-track {
            position: relative;
            width: 100%;
            height: 2.5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            margin: 6px 0 2px 0;
            overflow: hidden;
        }

        .resonance-string-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6e1d1d, #c62828 70%, var(--c-gold-leaf) 100%);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(223, 166, 104, 0.35);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bond-sub-hint {
            display: none;
            font-size: 10.5px;
            color: #b05c5c;
            font-family: "Kaiti", serif;
            font-style: italic;
            letter-spacing: 0.5px;
            margin-top: 4px;
            line-height: 1.35;
        }

        /* --- 📜 抽屉二：百物语封印录 & 奇物展柜 --- */
        .archive-stats {
            padding: 8px 4px 6px 4px;
            text-align: center;
            border-bottom: 1px dashed rgba(143, 38, 38, 0.2);
        }

        .archive-title {
            font-size: 13.5px;
            font-weight: bold;
            color: var(--c-gold-leaf);
            letter-spacing: 2px;
        }

        .archive-sub {
            font-size: 10px;
            color: #777;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* 自然雅致的空白扉页态：彻底告别文件上传框 */
        .archive-empty-leaf {
            padding: 24px 10px;
            text-align: center;
        }

        .empty-leaf-text {
            font-size: 11.5px;
            color: #73695f;
            font-family: "Kaiti", serif;
            letter-spacing: 2px;
            opacity: 0.85;
        }

        .empty-leaf-text::before,
        .empty-leaf-text::after {
            content: "—";
            color: rgba(143, 38, 38, 0.5);
            margin: 0 8px;
            font-family: sans-serif;
        }

        /* 怪谈卷宗条目 */
        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 155px;
            overflow-y: auto;
            padding: 8px 2px 4px 2px;
        }

        .seal-dossier {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            background: #141314;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-left: 2.5px solid #8f2626;
            border-radius: 2px;

                    const msgs = await getChatMessages(msgId, 1);

                    isHistorical = (msgId < (chatArray.length > 0 ? chatArray.length - 1 : -1));
                    if (msgs && msgs[0] && msgs[0].data) return { data: JSON.parse(JSON.stringify(msgs[0].data)), isHistorical };

                if (window.parent) {
                    window.parent.postMessage({ type: 'iframe-resize', height: h, source: 'lantern-ui' }, '*');
                    window.parent.postMessage({ type: 'resizeIframe', height: h }, '*');
                }
                try { if (window.frameElement) window.frameElement.style.height = h + 'px'; } catch (e) { }
            }, 50);
        }

        window.__lanternRO.observe(document.body);

            try {
                const Mvu = window.Mvu || (window.parent && window.parent.Mvu) || (window.top && window.top.Mvu);
                if (!Mvu) return;
                const mvuData = Mvu.getMvuData({ type: 'message', message_id: -1 });
                if (!mvuData) return;
                if (typeof _ !== 'undefined' && _.set) _.set(mvuData, path, value);
                await Mvu.replaceMvuData(mvuData, { type: 'message', message_id: -1 });
                if (Mvu.events && typeof $ !== 'undefined') {
                    $(document).trigger({ type: Mvu.events.VARIABLE_UPDATE_ENDED, detail: { stat_data: mvuData.stat_data || mvuData } });
                }
            } catch (e) { console.error("[Lantern Update]", e); }

            const kBottleneck = pendingEvents['系统_好感瓶颈'];
            if (kBottleneck) {
                $('#kiraga-sub-hint').text(`“${kBottleneck}”`).show();
            } else {
                $('#kiraga-sub-hint').text('').hide();
            }

            // 2. 绪川沙绘
            const saeFavor = _.get(all, 'stat_data.角色状态.绪川沙绘.好感度', 0);
            const saeLevel = Math.min(3, Math.max(0, _.get(all, 'stat_data.角色状态.绪川沙绘.好感度等级', 0)));
            const sCap = [30, 60, 90, 100][saeLevel] || 100;
            if (!isSaeRevealed) {
                $('#sae-name-display').html(`<span style="color:#666;">??? (指导老师)</span>`);
                $('#sae-num-display').text(`? / ?`);
                $('#res-fill-sae').css('width', '0%');
                $('#sae-sub-hint').text('').hide();
                if (!isHistorical) lastSaeLevel = -1;
            } else {
                let sRankUp = (!isHistorical && lastSaeLevel >= 0 && saeLevel > lastSaeLevel);
                if (!isHistorical) lastSaeLevel = saeLevel;

                $('#res-fill-sae').css('width', Math.min((saeFavor / sCap) * 100, 100) + '%');
                $('#sae-name-display').html(`绪川 沙绘 <span class="bond-title ${sRankUp ? 'rankup' : ''}">${SAE_TITLES[saeLevel]}</span>`);
                $('#sae-num-display').text(`${saeFavor} / ${sCap}`);

                const sBottleneck = pendingEvents['系统_沙绘瓶颈'];
                if (sBottleneck) {
                    $('#sae-sub-hint').text(`“${sBottleneck}”`).show();
                } else {
                    $('#sae-sub-hint').text('').hide();
                }
            }

            // ================= 📜 抽屉二渲染 =================
            const archives = _.get(all, 'stat_data.档案库.已完成怪谈', {});
            const solvedCount = Object.keys(archives).length;

            // 1. 典雅标题：0篇时叫“等待启封”，有怪谈后才称“第X夜”
            if (solvedCount === 0) {
                $('#archive-stats').html(
                    '<div class="archive-title">物語：等待启封</div>' +
                    '<div class="archive-sub">百物语 · 卷首空白</div>'
                );
            } else {
                $('#archive-stats').html(
                    `<div class="archive-title">物語 · 第${toKanjiNumber(solvedCount)}夜 <span style="font-size:10px; font-family:monospace; opacity:0.6; font-weight:normal;">[ ${solvedCount}/100 ]</span></div>` +
                    `<div class="archive-sub">已封存 ${solvedCount} 柱怪谈</div>`
                );
            }

            // 2. 列表渲染或清爽空白扉页
            let newArchiveHtml = '';
            if (solvedCount === 0) {
                newArchiveHtml =
                    '<div class="archive-empty-leaf">' +
                    '<div class="empty-leaf-text">纸页尚白，待青灯照夜</div>' +
                    '</div>';
                $('#souvenir-detail').hide();
            } else {
                Object.entries(archives).forEach(([t, rec]) => {
                    const sName = encodeURIComponent(rec.纪念品名称 || "");
                    const sDesc = encodeURIComponent(rec.纪念品描述 || "");
                    newArchiveHtml += `<div class="seal-dossier" data-title="${t}" data-sname="${sName}" data-sdesc="${sDesc}"><span style="letter-spacing:1px; z-index:1;">${t}</span><span class="seal-stamp">封</span></div>`;
                });
            }

            if ($('#archive-scroll').html() !== newArchiveHtml) {
                $('#archive-scroll').html(newArchiveHtml);

                // 3. 奇物展柜点击联动
                $('.seal-dossier').off('click').on('click', function () {
                    const wasActive = $(this).hasClass('active-dossier');
                    $('.seal-dossier').removeClass('active-dossier');
                    $('#souvenir-detail').hide();

                    if (!wasActive) {
                        $(this).addClass('active-dossier');
                        const name = decodeURIComponent($(this).attr('data-sname') || "");
                        const desc = decodeURIComponent($(this).attr('data-sdesc') || "");

                        if (name) {
                            $('#sv-title').text('纪念品：' + name);
                            $('#sv-desc').text(desc || "此物留于活动室中，气息已归于平静。");
                        } else {
                            $('#sv-title').text('无残留之物');
                            $('#sv-desc').text('异化消散，未在现世留下痕迹。');
                        }
                        $('#souvenir-detail').show();
                    }
                    reportHeight();
                });
            }

            // ================= 🍂 抽屉三渲染 =================
            const dateStr = _.get(all, 'stat_data.日历.当前日期', '10月2日');
            const mMatch = dateStr.match(/(d+)s*月s*(d+)/);
            let month = 10, day = 2;
            if (mMatch) { month = parseInt(mMatch[1]); day = parseInt(mMatch[2]); }
            const year = (month >= 4 && month <= 12) ? 2024 : 2025;
            const currentDateObj = new Date(year, month - 1, day);
            const weekDays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            const currentWeekDay = weekDays[currentDateObj.getDay()];

            function getDayStatus(y, m, d) {
                const wd = new Date(y, m - 1, d).getDay(); const md = m * 100 + d;
                if (md >= 725 && md <= 831) return { rest: true, type: "暑假" };
                if (md >= 1225 || md <= 107) return { rest: true, type: "寒假" };
                if (md >= 325 && md <= 405) return { rest: true, type: "春假" };
                if (md >= 429 && md <= 505) return { rest: true, type: "黄金周" };
                if ([101, 211, 223, 320, 811, 1103, 1123].includes(md)) return { rest: true, type: "法定假日" };
                if (wd === 0 || wd === 6) return { rest: true, type: "周末" };
                return { rest: false, type: "平日" };
            }
            const todayStatus = getDayStatus(year, month, day);

            let seasonConfig;
            if (month >= 3 && month <= 5) {
                seasonConfig = { text: "春季", color: "#f48fb1", haiku: "春寒入夜半<br>笔尖轻颤字未干<br>花落掩旧坛" };
            } else if (month >= 6 && month <= 8) {
                seasonConfig = { text: "夏季", color: "#4dd0e1", haiku: "骤雨暗回廊<br>青灯摇曳影惊墙<br>蝉泣送斜阳" };
            } else if (month >= 9 && month <= 11) {
                seasonConfig = { text: "秋季", color: "#dfa668", haiku: "秋风翻旧卷<br>谁人低语在耳畔<br>回头却不见" };
            } else {
                seasonConfig = { text: "冬季", color: "#81d4fa", haiku: "雪夜掩重门<br>炉火微温伴孤魂<br>闲话了无痕" };
            }

            $('#cal-haiku-display').html(seasonConfig.haiku);
            $('#cal-season-display').text(seasonConfig.text).css({ 'color': seasonConfig.color, 'border-color': seasonConfig.color + '50' });
            $('#cal-date-display').text(dateStr + " " + currentWeekDay);

            const currentWeight = getSortWeight(month * 100 + day);
            let nextEvent = SCHOOL_CALENDAR.find(e => getSortWeight(e.id) >= currentWeight) || SCHOOL_CALENDAR[0];
            const $eventBox = $('#cal-event-box');
            if (nextEvent.id === (month * 100 + day)) {
                $eventBox.css('--season-color', '#ffca28');
                $('#cal-event-badge').html(`<span style="color:#ffca28;">◆ 今日事件</span>`);
            } else {
                $eventBox.css('--season-color', seasonConfig.color);
                const tarMonth = Math.floor(nextEvent.id / 100); const tarDay = nextEvent.id % 100;
                const targetYear = (tarMonth < 4 && year === 2024) ? 2025 : (tarMonth >= 4 && year === 2025) ? 2024 : year;
                let dayDiff = Math.ceil((new Date(targetYear, tarMonth - 1, tarDay) - currentDateObj) / (1000 * 60 * 60 * 24));
                if (dayDiff < 0) dayDiff += 365;
                $('#cal-event-badge').html(`距今 <span style="color:${seasonConfig.color};">${dayDiff > 60 ? "未来日程" : `${dayDiff} 天后`}</span>`);
            }
            $('#cal-next-event').text(nextEvent.event);

            let nextHolidayStr = "";
            if (todayStatus.rest) {
                nextHolidayStr = `>>> 今日休息（${todayStatus.type}） <<<`;
            } else {
                for (let d = 1; d <= 7; d++) {
                    let tDate = new Date(year, month - 1, day + d);
                    let chk = getDayStatus(tDate.getFullYear(), tDate.getMonth() + 1, tDate.getDate());
                    if (chk.rest) {
                        nextHolidayStr = d === 1 ? `预告：明日休息（${chk.type}）` : `距下个休息日还有 ${d} 天`;
                        break;
                    }
                }
            }
            $('#cal-holiday-preview').text(nextHolidayStr || "近期暂无假日");

            // 关键词言灵日志
            const $kw = $('#drawer-keywords');
            const registry = _.get(all, 'stat_data.白物语注册表', {});
            const entries = Object.entries(registry);
            if (entries.length > 0 || phase === '怪谈') {
                $kw.addClass('open');
                $kw.empty();
                if (entries.length === 0) {
                    $kw.append('<div style="text-align:center; color:#555; font-size:11px;">等待言灵改写...</div>');
                } else {
                    entries.forEach(([oldW, d]) => {
                        $kw.append(`<div class="log-row"><span class="word-old">${oldW}</span><span style="color:#8f2626; margin:0 6px;">➜</span><span class="word-new">${d.改写后文本 || "???"}</span></div>`);
                    });
                }
            } else {
                $kw.removeClass('open').empty();
            }

            reportHeight();
        }

        function toggleDrawer(id, btnId) {
            const $target = $(id); const isOpen = $target.hasClass('open');
            $('.drawer').removeClass('open'); $('.vent-btn').removeClass('active');
            if (!isOpen) { $target.addClass('open'); $(btnId).addClass('active'); }
            reportHeight();
        }

        async function init() {
            if (typeof $ === 'undefined' && window.parent && window.parent.$) window.$ = window.parent.$;
            if (typeof _ === 'undefined' && window.parent && window.parent._) window._ = window.parent._;
            const snapshotInfo = await getSnapshotData();

            $('#btn-resonance').off('click').on('click', () => toggleDrawer('#drawer-resonance', '#btn-resonance'));
            $('#btn-seal').off('click').on('click', () => toggleDrawer('#drawer-seal', '#btn-seal'));
            $('#btn-calendar').off('click').on('click', () => toggleDrawer('#drawer-calendar', '#btn-calendar'));

            if (!snapshotInfo.isHistorical) {
                $('#lantern-stage').off('click').on('click', function (e) {
                    e.stopPropagation();
                    handleLanternClick();
                });
                $('#btn-modal-cancel').off('click').on('click', hideConfirm);
                $('#btn-modal-confirm').off('click').on('click', executeNextStory);
            }

            populateStatus(snapshotInfo.data, snapshotInfo.isHistorical);
            reportHeight();
        }

        $(init);
    </script>
</head>

<body>

                    color:#ccc;"></div>

                            0 0,0 15 11A3 3 0 0,0 12 8Z" />

                </div>

                    <div class="katashiro kiraga" id="kata-kiraga" title="白川绮罗香">

                            2zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 14a8 8 0 0 1-5.66-2.34A7.94 7.94 0 0 1 4
                            12c0-2.21.9-4.21 2.34-5.66A7.94 7.94 0 0 1 12 4v2a6 6 0 0 0 0 12v2z" />
                    </svg>
                </div>
                <div class="vent-btn" id="btn-seal" title="已封存百物语">
                    <svg class="vent-icon" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2
                            10H7v-2h10v2zm0-4H7V7h10v2z" />

                            2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z" />
                    </svg>
                </div>
            </div>

            <!-- 🎴 抽屉一：同调羁绊 -->
            <div class="drawer" id="drawer-resonance">
                <div class="drawer-content" style="padding: 10px 6px 8px 6px;">
                    <div class="bond-block">
                        <div class="bond-header-row">
