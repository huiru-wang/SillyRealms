<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SR Design Tokens</title><style>
body{font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;padding:40px;background:#f7f8fb;color:#202434}
main{max-width:930px;margin:auto}h1{font-size:30px;margin:0}p{color:#4c5568;line-height:1.6}.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:#fff;border:1px solid #d9dde6;border-radius:14px;padding:24px}.swatches{display:flex;gap:4px}.swatches span{flex:1;height:38px;border-radius:6px}
button{background:#4f46bd;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:650}
@media(max-width:600px){body{padding:20px}.cols{grid-template-columns:1fr}}
</style><main><h1>SillyRealms Design System</h1><p>Refactoring UI 方法，冷色中性背景，紫色强调，明暗主题语义变量。</p><div class="cols"><section class="card"><h2>Primary</h2><div class="swatches"><span style="background:#f3ebff"></span><span style="background:#d8bcff"></span><span style="background:#be96f7"></span><span style="background:#9776e8"></span><span style="background:#6258d8"></span><span style="background:#4239c6"></span><span style="background:#2e27a7"></span><span style="background:#1a1687"></span><span style="background:#080665"></span></div><p>仅用于重点交互、状态聚焦。</p><button>开始故事 →</button></section><section class="card"><h2>Neutral</h2><div class="swatches"><span style="background:#fafdff"></span><span style="background:#f6fbfd"></span><span style="background:#d3dee4"></span><span style="background:#b1c0c8"></span><span style="background:#919eac"></span><span style="background:#707a8f"></span><span style="background:#5c6479"></span><span style="background:#494e62"></span><span style="background:#35394c"></span><span style="background:#222435"></span><span style="background:#11121f"></span></div><p>表面层次优先于阴影和描边堆叠。</p></section><section class="card"><h2>Typography</h2><h1>故事从这里开始</h1><p>工作台标题 30px，正文 14px，辅助信息 12px。</p></section><section class="card"><h2>Spacing</h2><p>4 · 8 · 12 · 16 · 24 · 32 · 48 · 64</p><p>组外距离始终大于组内，避免每处相同间距。</p></section></div></main></html>
